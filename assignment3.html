<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block and Inline Elements</title>
    <style>
        .block { background-color: lightblue; padding: 10px; margin: 8px 0; }
        .inline { background-color: lightgreen; }
    </style>
</head>
<body>
    
    <div class="block">Block 1</div>
    <div class="block">Block 2</div>
    
    <p><span class="inline">Inline 1</span> <span class="inline">Inline 2</span>
       <span class="inline">Inline 3</span></p>
</body>
</html>
